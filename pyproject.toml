[project]
name = "ds-platform"
version = "0.0.1"
description = "Reusable semantic contracts for data, ML, and AI project artifacts."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "rychen1" }]
keywords = [
    "data-engineering",
    "mlops",
    "provenance",
    "lineage",
    "evaluation",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.10",
]

[project.optional-dependencies]
xgboost = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
]
lightgbm = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "lightgbm>=4.0",
]
catboost = [
    "numpy>=1.26",
    "pandas>=2.2",
    "catboost>=1.2",
]
boosting = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "lightgbm>=4.0",
    "catboost>=1.2",
]

[dependency-groups]
dev = [
    "pyright>=1.1",
    "pytest>=8",
    "ruff>=0.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "lightgbm>=4.0",
    "catboost>=1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ds_platform"]

[tool.ruff]
src = ["src", "tests"]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
